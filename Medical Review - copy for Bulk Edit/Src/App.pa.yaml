App:
  Properties:
    OnStart: "=//Set(getStatus, \"\");\n\n//Set(getStatus, If(First([@PowerBIIntegration].Data).Role  = \"Scientific Reviewer\", \"Awaiting Scientific Review\", \"Awaiting Medical Review\"));\n\n\nSet(\n  \n    getStatus,\n      If(\n        Lower( Substitute( Trim( First([@PowerBIIntegration].Data).Role ), Char(160), \"\" ) ) = \"scientific reviewer\",\n        \"Awaiting Scientific Review\",\n        \"Awaiting Medical Review\"\n      )\n  \n);\n\n\nClearCollect(\n        Getdata,\n        ShowColumns(\n           \n                vs_review_workflow_data\n               // Status = getStatus\n            ,\n            Role,\n            Status,\n            data_management_query,\n            data_management_query_by_ai,\n            medical_query,\n            medical_query_by_ai,\n            medical_reviewer_comment,\n            medical_reviewer_comment_by_ai,\n            non_query_action,\n            participant_id,\n            project_code,\n            record_id,\n            scientific_reviewer_comment,\n            scientific_reviewer_comment_by_ai,\n            visit_date\n        )\n    ); "
    Theme: =PowerAppsTheme
