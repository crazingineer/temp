            Height: =101
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 0, 0, 1)
            OnSelect: |
              =Set(
                  checkRecordId,
                  LookUp(
                      vs_review_workflow_data,
                      record_id = First([@PowerBIIntegration].Data).record_id
                  )
              );
              If(
                  IsBlank(checkRecordId),
                  Patch(
                      vs_review_workflow_data,
                      Defaults(vs_review_workflow_data),
                      {
                          Status: "Awaiting Medical Review",
                          scientific_review_modified_by: User().FullName,
                          scientific_review_modified_on: Now(),
                          scientific_reviewer_comment: txt_sci_reviewer.Text,
                          medical_reviewer_comment: txt_med_reviewer.Text,
                          medical_query: txt_medical_q.Text,
                          data_management_query: txt_data_mgnt_q.Text,
                          non_query_action: txt_Non_q.Text,
                          record_id: First([@PowerBIIntegration].Data).record_id,
                          project_code: Value(txt_project_id.Text),
                          participant_id: txt_participant_id.Text,
                          visit_date: DateValue(txt_visit_date.Text),
                          Role: First([@PowerBIIntegration].Data).Role
                      }
                  ),
                  Patch(
                      vs_review_workflow_data,
                      LookUp(
                          vs_review_workflow_data,
                          record_id = First([@PowerBIIntegration].Data).record_id
                      ),
                      {
                          Status: "Awaiting Medical Review",
                          scientific_review_modified_by: User().FullName,
                          scientific_review_modified_on: Now(),
                          scientific_reviewer_comment: txt_sci_reviewer.Text,
                          medical_reviewer_comment: txt_med_reviewer.Text,
                          medical_query: txt_medical_q.Text,
                          data_management_query: txt_data_mgnt_q.Text,
                          non_query_action: txt_Non_q.Text,
                          record_id: First([@PowerBIIntegration].Data).record_id,
                          project_code: Value(txt_project_id.Text),
                          participant_id: txt_participant_id.Text,
                          visit_date: DateValue(txt_visit_date.Text),
                          Role: First([@PowerBIIntegration].Data).Role
                      }
                  )
              );
              Patch(
                  vs_review_workflow_data_audit,
                  Defaults(vs_review_workflow_data_audit),
                  {
                      visit_date: DateValue(
                          Trim(txt_visit_date.Text),
                          "en-GB"
                      ),
                      data_management_query: txt_data_mgnt_q.Text,
                      scientific_reviewer_comment: txt_sci_reviewer.Text,
                      medical_query: txt_medical_q.Text,
                      medical_reviewer_comment: txt_med_reviewer.Text,
                      scientific_review_modified_by: User().FullName,
                      scientific_review_modified_on: Now(),
                      non_query_action: txt_Non_q.Text,
                      participant_id: txt_participant_id.Text,
                      project_code: Value(txt_project_id.Text),
                      record_id: First([@PowerBIIntegration].Data).record_id,
                      Role: First([@PowerBIIntegration].Data).Role,
                      Status: "Awaiting Medical Review"
                  }
              );
              Collect(
                  Getdata,
                  ShowColumns(
                      vs_review_workflow_data,
                      Role,
                      data_management_query,
                      medical_query,
                      medical_reviewer_comment,
                      non_query_action,
                      participant_id,
                      project_code,
                      record_id,
                      scientific_reviewer_comment,
                      visit_date
                  )
              );
              Notify(
                  "Your record has been saved successfully",
                  NotificationType.Success
              );
              Reset(txt_sci_reviewer);
              Reset(txt_med_reviewer);
              Reset(txt_medical_q);
              Reset(txt_data_mgnt_q);
              Reset(txt_Non_q);
              Reset(txt_project_id);
              Reset(txt_visit_date);
            PressedBorderColor: =ColorFade(RGBA(105, 121, 126, 1), -50%)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 0, 0, 1)
            Size: =20
            Text: ="Submit"
            Visible: |-
              =If(First([@PowerBIIntegration].Data).Role = "Scientific Reviewer", true, false) &&
              If(CountRows([@PowerBIIntegration].Data)=1, true, false)
