      - btn_Submit_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(219, 219, 219, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(0, 0, 0, 0.5)
            DisplayMode: =
            Fill: =RGBA(0, 0, 0, 1)
            FocusedBorderColor: =ColorFade(Self.Fill, -75%)
            Font: =Font.'Segoe UI'
            Height: =95
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 0, 0, 1)
            OnSelect: "=UpdateContext({ showSpinner: true });\n\n// 1. Build the collection. \n// We include the \"ID\" to tell Patch whether to Update (ID exists) or Create (ID is blank).\nClearCollect(\n    colSafeUpdates,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        With(\n            {\n                // Try to find the existing record in SQL\n                _existingRecord: LookUp(\n                    vs_review_workflow_data,\n                    record_id = _item.record_id\n                )\n            },\n            {\n                // SYSTEM ID: If found, use it (Update). If blank, leave blank (Create).\n                ID: _existingRecord.ID, \n                \n                // --- FIELDS TO UPDATE (From Bulk Edit Screen) ---\n                Status: \"Awaiting Medical Review\",\n                scientific_reviewer_comment: txt_sci_reviewer_1.Text,\n                scientific_review_modified_by: User().FullName,\n                scientific_review_modified_on: Now(),\n                bulk_update: \"Yes\",\n                Role: First([@PowerBIIntegration].Data).Role,\n                \n                // --- MANDATORY FIELDS FOR NEW RECORDS ---\n                // These are required if we are creating a row. \n                // For updates, passing the same value is harmless.\n                record_id: _item.record_id,\n                participant_id: _item.participant_id,\n                project_code: Value(_item.project_code),\n                visit_date: DateTimeValue(_item.visit_date)\n                \n                // --- OMITTED FIELDS (To Protect Data) ---\n                // We deliberately exclude 'medical_query', 'data_management_query', etc.\n                // - For Updates: SQL keeps the existing values.\n                // - For Creates: SQL sets them to NULL (correct for a fresh review).\n            }\n        )\n    )\n);\n\n// 2. Safety Check: Ensure we don't submit empty rows\nRemoveIf(colSafeUpdates, IsBlank(record_id));\n\n// 3. Single Patch to Database (Handles both Updates and Creates)\nIf(\n    CountRows(colSafeUpdates) > 0,\n    Patch(\n        vs_review_workflow_data,\n        colSafeUpdates\n    );\n    Notify(\n        \"Success! \" & CountRows(PowerBIIntegration.Data) & \" records were updated.\nContinue bulk editing until all records are cleared from the screen.\",\n        NotificationType.Success\n    ),\n    Notify(\n        \"No records to update.\",\n        NotificationType.Warning\n    )\n);\n\n// 4. Audit Logging\nClearCollect(\n    colAuditPayload,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        {\n            Status: \"Awaiting Medical Review\",\n            record_id: _item.record_id,\n            visit_date: DateTimeValue(_item.visit_date),\n            participant_id: _item.participant_id,\n            project_code: Value(_item.project_code),\n            Role: First([@PowerBIIntegration].Data).Role,\n            scientific_reviewer_comment: txt_sci_reviewer_1.Text,\n            scientific_review_modified_by: User().FullName,\n            scientific_review_modified_on: Now(),\n            bulk_update: \"Yes\"\n        }\n    )\n);\n\n// 5. Trigger Flow\nCollect(\n    vs_review_workflow_data_audit,\n    colAuditPayload\n);\n\nSet(\n    varFlowResult, \n    'Button->InvokeanHTTPrequest'.Run()\n);\n\nIf(\n    varFlowResult.datasetrefreshstatus = \"Completed\",\n    Notify(\"Flow processed successfully.\", NotificationType.Success);\n    PowerBIIntegration.Refresh();\n    Reset(txt_med_reviewer_1);\n    Reset(txt_sci_reviewer_1),\n    Notify(\"Update Failed or Flow Error.\", NotificationType.Error)\n);\nNavigate('Scientific Reviewer',BorderStyle.None);\nUpdateContext({ showSpinner: false });"
            PressedBorderColor: =ColorFade(RGBA(105, 121, 126, 1), -50%)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 0, 0, 1)
            Size: =20
            Text: ="Submit"
            Visible: '=If(First([@PowerBIIntegration].Data).Role = "Scientific Reviewer", true, false) '
            X: =367
            Y: =1953
      - btn_Notify_scientific_reviewer_1:
          Control: Classic/Button@2.2.0
