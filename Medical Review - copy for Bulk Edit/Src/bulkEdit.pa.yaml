            OnSelect: "=UpdateContext({ showSpinner: true });\nClearCollect(\n    colSafeUpdates,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        With(\n            {\n                _realRecord: LookUp(\n                    vs_review_workflow_data,\n                    record_id = _item.record_id\n                )\n            },\n            If(\n                !IsBlank(_realRecord),\n                Patch(\n                    _realRecord,\n                    {\n                        Status: \"Review Completed\",\n                        medical_reviewer_comment: txt_med_reviewer_1.Text,\n                        medical_review_modified_by: User().FullName,\n                        medical_review_modified_on: Now(),\n                        bulk_update: \"Yes\",\n                        Role: First([@PowerBIIntegration].Data).Role\n                    }\n                )\n            )\n        )\n    )\n);\nRemoveIf(\n    colSafeUpdates,\n    IsBlank(record_id)\n);\nIf(\n    CountRows(colSafeUpdates) > 0,\n    Patch(\n        vs_review_workflow_data,\n        colSafeUpdates\n    )\n);\nClearCollect(\n    colBulkAudit,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        {\n            Status: \"Review Completed\",\n            record_id: _item.record_id,\n            visit_date: DateTimeValue(_item.visit_date),\n            participant_id: _item.participant_id,\n            project_code: Value(_item.project_code),\n            Role: First([@PowerBIIntegration].Data).Role,\n            medical_reviewer_comment: txt_med_reviewer_1.Text,\n            medical_review_modified_by: User().FullName,\n            medical_review_modified_on: Now(),\n            scientific_reviewer_comment: txt_sci_reviewer_1.Text,\n            bulk_update: \"Yes\"\n        }\n    )\n);\nCollect(\n    vs_review_workflow_data_audit,\n    colBulkAudit\n);\n\nSet(\n    varFlowResult, \n    'Button->InvokeanHTTPrequest'.Run()\n);\n\nIf(\n    varFlowResult.datasetrefreshstatus = \"Completed\",\n    // IF SUCCESS:\n    Notify(\n        \"Success! \" & CountRows(PowerBIIntegration.Data) & \" records were updated.\nContinue bulk editing until all records are cleared from the screen.\",\n        NotificationType.Success\n    );\n    PowerBIIntegration.Refresh();\n    Reset(txt_med_reviewer_1);\n    Reset(txt_sci_reviewer_1),\n    \n    // IF FAILED\n    Notify(\n        \"Update Failed. Please check the data and retry.\",\n        NotificationType.Error\n    )\n);\nNavigate('Scientific Reviewer',BorderStyle.None);\nUpdateContext({ showSpinner: false });\n\n\n///////////////////////////////////////////\n//Notify(\n//    \"Review Completed Successfully!\",\n//    NotificationType.Success\n//);\n//'Button->InvokeanHTTPrequest'.Run();\n//PowerBIIntegration.Refresh();\n\n//Reset(txt_med_reviewer_1);\n//Reset(txt_sci_reviewer_1);"
