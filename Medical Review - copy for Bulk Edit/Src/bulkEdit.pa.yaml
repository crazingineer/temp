            FocusedBorderColor: =ColorFade(Self.Fill, -75%)
            Font: =Font.'Segoe UI'
            Height: =101
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 0, 0, 1)
            OnSelect: "=UpdateContext({ showSpinner: true });\nClearCollect(\n    colSafeUpdates,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        With(\n            { _realRecord: LookUp(vs_review_workflow_data, record_id = _item.record_id) },\n\n            If(\n                !IsBlank(_realRecord),\n                Patch(\n                    _realRecord,\n                    {\n                        Status: \"Awaiting Scientific Review\",\n                        medical_review_modified_by: User().FullName,\n                        medical_review_modified_on: Now(),\n                        medical_reviewer_comment: txt_med_reviewer_1.Text,\n                        bulk_update: \"Yes\",\n                        Role: First([@PowerBIIntegration].Data).Role\n                    }\n                )\n            )\n        )\n    )\n);\n\n\nRemoveIf(colSafeUpdates, IsBlank(record_id));\n\n\nIf(\n    CountRows(colSafeUpdates) > 0,\n    Patch(vs_review_workflow_data, colSafeUpdates)\n);\n\n\nClearCollect(colBulkAudit,\n    ForAll(\n        [@PowerBIIntegration].Data As _item,\n        {\n            Status: \"Awaiting Scientific Review\",\n            record_id: _item.record_id,\n            visit_date: DateTimeValue(_item.visit_date),\n            participant_id: _item.participant_id,\n            \n            project_code: Value(_item.project_code),\n            Role: First([@PowerBIIntegration].Data).Role,\n            \n            medical_reviewer_comment: txt_med_reviewer_1.Text,\n            medical_review_modified_by: User().FullName,\n            medical_review_modified_on: Now(),\n            \n            scientific_reviewer_comment: txt_sci_reviewer_1.Text,\n            bulk_update: \"Yes\"\n        }\n    )\n);\n\n\nCollect(vs_review_workflow_data_audit, colBulkAudit);\n\n\nSet(\n    varFlowResult, \n    'Button->InvokeanHTTPrequest'.Run()\n);\n\nIf(\n    varFlowResult.datasetrefreshstatus = \"Completed\",\n    // IF SUCCESS:\n    Notify(\n        \"Success! \" & CountRows(PowerBIIntegration.Data) & \" records were sent back to scientific reviewer. Continue bulk editing until all records are cleared from the screen.\",\n        NotificationType.Success\n    );\n    PowerBIIntegration.Refresh();\n    Reset(txt_med_reviewer_1);\n    Reset(txt_sci_reviewer_1),\n    \n    // IF FAILED\n    Notify(\n        \"Update Failed. Please check the data and retry.\",\n        NotificationType.Error\n    )\n);\nNavigate('Scientific Reviewer',BorderStyle.None);\nUpdateContext({ showSpinner: false });\n\n\n\n////////////////////////////////////////////////////////////////////\n//Notify(\"Record returned to Scientific Reviewer.\", NotificationType.Success);\n//'Button->InvokeanHTTPrequest'.Run();\n//PowerBIIntegration.Refresh();\n\n//Reset(txt_med_reviewer_1);\n//Reset(txt_sci_reviewer_1);"
            PressedBorderColor: =ColorFade(RGBA(105, 121, 126, 1), -50%)
